spring:
  application:
    name: eunhye-hymn-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eunhye_hymn}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${JWT_SECRET:change-me}
  invite:
    code: ${INVITE_CODE:change-me}
