name: API CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle 8.7 설치
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: 테스트 실행
        run: gradle test --no-daemon --stacktrace
