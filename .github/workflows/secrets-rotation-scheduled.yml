name: Secrets Rotation Scheduled

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "Operator name recorded in logs"
        required: false
        default: "github-actions"
      max_age_days:
        description: "Max allowed secret age in days"
        required: false
        default: "90"
      include_mobile_release_secrets:
        description: "Include mobile release secret scope"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  secrets-rotation:
    runs-on: ubuntu-latest
    concurrency:
      group: secrets-rotation-scheduled-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      OPERATOR: ${{ github.event_name == 'workflow_dispatch' && inputs.owner || 'github-actions' }}
      MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || '90' }}
      INCLUDE_MOBILE_RELEASE_SECRETS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mobile_release_secrets || 'true' }}
      TARGET_BRANCH: develop
    steps:
      - uses: actions/checkout@v4

      - name: Run secrets rotation cycle and alert on HOLD
        id: cycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tmp/secrets-rotation-scheduled -Force | Out-Null

          $args = @(
            "-NoProfile",
            "-File", "./scripts/secrets-rotation-cycle.ps1",
            "-Repo", "$env:GITHUB_REPOSITORY",
            "-Owner", "$env:OPERATOR",
            "-MaxAgeDays", "$env:MAX_AGE_DAYS",
            "-AsJson"
          )
          if ("$env:INCLUDE_MOBILE_RELEASE_SECRETS" -eq "true") {
            $args += "-IncludeMobileReleaseSecrets"
          }

          $output = & pwsh @args
          $exitCode = $LASTEXITCODE
          $rendered = ($output -join "`n")
          $rendered | Out-File -FilePath .tmp/secrets-rotation-scheduled/secrets-rotation-result.json -Encoding utf8

          if ($exitCode -ne 0) {
            $category = "secret_unknown"
            try {
              $result = $rendered | ConvertFrom-Json
              if ([int]$result.MissingCount -gt 0) {
                $category = "secret_missing"
              } elseif ([int]$result.StaleCount -gt 0) {
                $category = "secret_stale"
              }

              & pwsh -NoProfile -File ./scripts/ops-health-issue-alert.ps1 `
                -Repo "$env:GITHUB_REPOSITORY" `
                -Branch "$env:TARGET_BRANCH" `
                -Overall HOLD `
                -FailureCategory $category `
                -Evidence "$($result.LogFile)" `
                -Notes "$($result.Notes)" `
                -Operator "$env:OPERATOR" `
                -SourceLog "$($result.LogFile)" `
                -AsJson | Out-File -FilePath .tmp/secrets-rotation-scheduled/issue-alert-result.json -Encoding utf8
            } catch {
              Write-Host "Failed to parse secrets rotation JSON for alert context."
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "exit_code=$exitCode"
          Write-Host $rendered
          exit 0

      - name: Upload cycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-rotation-cycle-result
          path: .tmp/secrets-rotation-scheduled/secrets-rotation-result.json

      - name: Upload alert artifact
        if: hashFiles('.tmp/secrets-rotation-scheduled/issue-alert-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: secrets-rotation-issue-alert-result
          path: .tmp/secrets-rotation-scheduled/issue-alert-result.json

      - name: Commit updated secrets logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/secrets-rotation-log.md || true
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "chore(ops): scheduled secrets rotation cycle log update"
          git push

      - name: Enforce cycle result
        if: steps.cycle.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "secrets rotation cycle returned HOLD"
          exit 1
