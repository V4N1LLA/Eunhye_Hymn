name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "infra/aws/deploy.sh"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/**"
      - "infra/aws/deploy.sh"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1

  deploy-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy script syntax
        run: bash -n infra/aws/deploy.sh
