name: Deploy Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      enable_awslogs:
        description: "Enable CloudWatch awslogs overlay during deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  preflight-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          missing=()
          [ -z "${AWS_ACCESS_KEY_ID}" ] && missing+=("AWS_ACCESS_KEY_ID")
          [ -z "${AWS_SECRET_ACCESS_KEY}" ] && missing+=("AWS_SECRET_ACCESS_KEY")
          [ -z "${AWS_REGION}" ] && missing+=("AWS_REGION")
          [ -z "${ECR_REGISTRY}" ] && missing+=("ECR_REGISTRY")
          [ -z "${EC2_HOST}" ] && missing+=("EC2_HOST")
          [ -z "${EC2_SSH_KEY}" ] && missing+=("EC2_SSH_KEY")
          [ -z "${DEPLOY_ENV_FILE}" ] && missing+=("DEPLOY_ENV_FILE")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

          echo "All required secrets are set."

  # ── 1. API Tests ─────────────────────────────────────────────
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon --stacktrace

  # ── 2. Admin Build Check ─────────────────────────────────────
  check-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ── 3. Build & Push Docker Images ────────────────────────────
  build-and-push:
    needs: [preflight-secrets, test-api, check-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        working-directory: apps/api
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${ECR_REGISTRY}/eunhye-hymn/api:${IMAGE_TAG}" -t "${ECR_REGISTRY}/eunhye-hymn/api:latest" .
          docker push "${ECR_REGISTRY}/eunhye-hymn/api:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/eunhye-hymn/api:latest"

      - name: Build and push Admin image
        working-directory: apps/admin
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "${ECR_REGISTRY}/eunhye-hymn/admin:${IMAGE_TAG}" -t "${ECR_REGISTRY}/eunhye-hymn/admin:latest" .
          docker push "${ECR_REGISTRY}/eunhye-hymn/admin:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/eunhye-hymn/admin:latest"

  # ── 4. Deploy to EC2 ─────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: staging-ec2-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy compose file and deploy script to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            infra/aws/docker-compose.prod.yml \
            infra/aws/docker-compose.prod.awslogs.yml \
            infra/aws/deploy.sh \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/app/

      - name: Write .env file on EC2
        run: |
          cat <<'EOF' > /tmp/.env.deploy
          ${{ secrets.DEPLOY_ENV_FILE }}
          EOF
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/.env.deploy \
            ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/app/.env
          rm -f /tmp/.env.deploy

      - name: Run deploy script
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ENABLE_AWSLOGS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_awslogs || secrets.ENABLE_AWSLOGS }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ secrets.EC2_HOST }} \
            "cd /home/ec2-user/app && \
             export ECR_REGISTRY=${ECR_REGISTRY} && \
             export AWS_REGION=${{ env.AWS_REGION }} && \
             export ENABLE_AWSLOGS=${ENABLE_AWSLOGS} && \
             chmod +x deploy.sh && \
             ./deploy.sh"

      - name: Verify deployment
        run: |
          set -euo pipefail

          host="${{ secrets.EC2_HOST }}"

          check_ping() {
            local url="$1"
            local max_attempts="$2"
            local sleep_seconds="$3"
            local attempt
            local body

            for attempt in $(seq 1 "${max_attempts}"); do
              body="$(curl -fsS "${url}" 2>/dev/null || true)"
              if printf "%s" "${body}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
                echo "Ping check passed on attempt ${attempt}"
                return 0
              fi
              echo "Ping check attempt ${attempt}/${max_attempts} failed; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done

            echo "::error::Ping check failed after ${max_attempts} attempts (${url})"
            return 1
          }

          check_http_status() {
            local name="$1"
            local url="$2"
            local max_attempts="$3"
            local sleep_seconds="$4"
            local attempt
            local code

            for attempt in $(seq 1 "${max_attempts}"); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "${url}" || true)"
              if [[ "$name" == "admin-root" && ( "${code}" == "200" || "${code}" == "301" || "${code}" == "302" ) ]]; then
                echo "${name} check passed with HTTP ${code} on attempt ${attempt}"
                return 0
              fi
              if [[ "$name" == "admin-auth-guard" && ( "${code}" == "401" || "${code}" == "403" ) ]]; then
                echo "${name} check passed with HTTP ${code} on attempt ${attempt}"
                return 0
              fi
              echo "${name} check attempt ${attempt}/${max_attempts} returned HTTP ${code}; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done

            echo "::error::${name} check failed after ${max_attempts} attempts (${url})"
            return 1
          }

          check_container_state() {
            local container_name="$1"
            local expected_state="$2"
            local max_attempts="$3"
            local sleep_seconds="$4"
            local attempt
            local state

            for attempt in $(seq 1 "${max_attempts}"); do
              state="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                "ec2-user@${host}" \
                "docker inspect --format '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' '${container_name}'" \
                2>/dev/null || true)"
              state="$(printf '%s' "${state}" | xargs || true)"

              if [[ "${expected_state}" == "running-healthy" && "${state}" == "running healthy" ]]; then
                echo "${container_name} state check passed (${state}) on attempt ${attempt}"
                return 0
              fi
              if [[ "${expected_state}" == "running" && "${state}" == running* ]]; then
                echo "${container_name} state check passed (${state}) on attempt ${attempt}"
                return 0
              fi

              echo "${container_name} state attempt ${attempt}/${max_attempts} returned '${state}'; retrying in ${sleep_seconds}s"
              sleep "${sleep_seconds}"
            done

            echo "::error::${container_name} state check failed after ${max_attempts} attempts (expected=${expected_state}, last='${state}')"
            return 1
          }

          echo "Waiting for services to start..."
          sleep 30
          check_ping "http://${host}/api/v1/ping" 10 6
          check_http_status "admin-root" "http://${host}/" 5 4
          check_http_status "admin-auth-guard" "http://${host}/api/v1/admin/hymns" 5 4
          check_container_state "eunhye-api" "running-healthy" 10 6
          check_container_state "eunhye-nginx" "running" 5 4
